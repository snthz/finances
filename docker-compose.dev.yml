# Sólo para desarrollo local: Postgres en localhost:5433 (lo levanta `bun dev`)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances
      POSTGRES_DB: finances
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances -d finances"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
